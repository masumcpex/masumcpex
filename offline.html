<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অফলাইন | Masumcpex Hub</title>
<meta name="theme-color" content="#0E6E5C">
<style>
  html,body{height:100%;margin:0;}
  body{
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-family:'Hind Siliguri','Inter',sans-serif;
    background:linear-gradient(160deg,#0E6E5C,#1B2A45);
    color:#F8FAFC; padding:24px; box-sizing:border-box;
  }
  .box{max-width:420px;}
  .icon{font-size:56px; margin-bottom:12px;}
  h1{font-size:22px; margin:0 0 10px;}
  p{font-size:15px; line-height:1.6; color:#E5E7EB; margin:0 0 22px;}
  button{
    background:#C79A3B; color:#1B2A45; border:none; padding:12px 26px;
    border-radius:999px; font-size:15px; font-weight:600; cursor:pointer;
  }
  button:active{transform:scale(0.97);}
</style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>ইন্টারনেট সংযোগ নেই</h1>
    <p>এই মুহূর্তে আপনি অফলাইনে আছেন। আগে দেখা পেজগুলো ক্যাশ থেকে খোলা যেতে পারে, তবে এই পেজটি এখনো সংরক্ষিত হয়নি। সংযোগ ফিরলে আবার চেষ্টা করুন।</p>
    <button onclick="location.reload()">আবার চেষ্টা করুন</button>
  </div>
</body>
</html>
